# Real stack: Postgres (logical decoding) -> Debezium Connect -> Kafka. Not run in the build environment.
services:
  postgres:
    image: postgres:16.4
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: shop
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    depends_on: [postgres, kafka]
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: cfg
      OFFSET_STORAGE_TOPIC: off
      STATUS_STORAGE_TOPIC: st
